<!doctype html><html lang="tr"><head><meta charset="utf-8">
<!-- oltâ · OLTÂ FRIDAY 2026 katalog şablonları (net25, net15), 1080×1080.
     Motor bu sayfayı ürün başına açar: window.__CTX = {logo, key, p}; p = {name, old, now, imgs}.
     Renkler Olta kitinden: siyah/beyaz/gri; tek vurgu kırmızı bitiş tarihi kutusu. Üstte siyah şerit: BLACK FRIDAY, tarih kutusu, büyük oran, küçük kategoriler. Logo ürün adının üstünde.
     Font: sitede Helvetica/Arial; sunucuda Helvetica yok, Arial ölçülerindeki Arimo kullanılır. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&display=block">
<style>
html,body{margin:0;padding:0;width:1080px;height:1080px;overflow:hidden;background:#fff}
*{box-sizing:border-box}
.ad{width:1080px;height:1080px;background:#fff;color:#000;font-family:Arimo,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
.head{height:272px;flex-shrink:0;background:#000;color:#fff;padding:30px 48px 0;display:flex;flex-direction:column}
.head .row{display:flex;justify-content:space-between;align-items:center;height:52px}
/* üst satır: solda BLACK FRIDAY, sağda kırmızı tarih kutusu; ikisi aynı punto ve aynı yükseklikte */
.head .bf{font-weight:700;font-size:26px;letter-spacing:9px;line-height:52px;white-space:nowrap}
.end{background:var(--box,#E0101A);color:var(--boxfg,#fff);font-weight:700;font-size:22px;letter-spacing:4px;line-height:52px;height:52px;padding:0 22px;border-radius:2px;white-space:nowrap}
/* başlık tam içerik genişliğine oturtulur (fitBig): sol kenarı BLACK FRIDAY'le, sağ kenarı tarih kutusuyla aynı hizada */
.head .big{display:block;font-weight:700;font-size:112px;line-height:.95;letter-spacing:-2px;margin-top:20px;white-space:nowrap;width:max-content}
.head .cats{font-size:18px;letter-spacing:6px;color:#BDBDBD;margin-top:16px}
.media{height:600px;flex-shrink:0;margin:24px 48px 0;display:flex;gap:24px}
.img{background:#F4F4F4;overflow:hidden}
.img img{width:100%;height:100%;object-fit:cover;display:block}
.col{flex-grow:1;display:flex;flex-direction:column;gap:24px;min-width:0}
.foot{flex-grow:1;margin:0 48px;display:flex;align-items:flex-end;justify-content:space-between;gap:32px;padding-bottom:30px;min-height:0}
.foot .left{flex-grow:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.foot .logo{height:40px;width:auto;align-self:flex-start;display:block}
.foot .name{font-weight:400;font-size:36px;line-height:1.15;letter-spacing:1px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.foot .right{flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.old{font-size:24px;color:#999;text-decoration:line-through}
.lbl{font-weight:700;font-size:15px;letter-spacing:4px;color:#666}
.now{font-weight:700;font-size:58px;line-height:1;letter-spacing:-1px;white-space:nowrap}
/* ================= TikTok dikey · 1080×1920 (net25V / net15V) =================
   Güvenli alan (Barbarian'daki gibi): üstte ~140px TikTok üst menüsü, sağda x>880 & y>880 butonlar, altta y>1380 açıklama + CTA.
   Başlık y<880 olduğu için tam genişlik; görseller ve isim/fiyat x≤880, y≤1360 içinde. Altta siyah bant (TikTok metni üstüne gelir). */
html.v,html.v body,.ad.v{height:1920px}
.ad.v .head{height:400px;padding-top:150px}
.ad.v .media{width:832px;height:710px;margin:24px 0 0 48px;flex-grow:0}
.ad.v .vfoot{height:206px;margin:20px 0 0 48px;width:832px;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.ad.v .vfoot .logo{height:40px;width:auto;display:block}
.ad.v .vfoot .name{font-size:36px;line-height:1.15;letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:832px}
.ad.v .vfoot .lbl{margin-top:8px}
.ad.v .vpr{display:flex;align-items:baseline;gap:20px;white-space:nowrap}
.ad.v .vpr .now{font-size:76px}
.ad.v .vpr .old{font-size:30px}
.ad.v .vbot{flex-grow:1;background:#000;margin-top:38px}
</style></head>
<body>
<script>
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

// Teklife göre değişen kısımlar
const OFFER = {
  net25: { pct: '%25', cats: 'KOLYE · CHARM · YÜZÜK · KÜPE', end: 'SON GÜN 30 KASIM', label: 'BLACK FRIDAY FİYATI' },
  net15: { pct: '%15', cats: 'BİLEKLİK · ZİNCİR', end: 'SON GÜN 30 KASIM', label: 'BLACK FRIDAY FİYATI' },
};

// Görsel düzeni görsel sayısına göre: 3 → solda silver (520px), sağda küçük gold ve büyük takılı görsel · 2 → iki eşit dikey parça · 1 → tek görsel tüm alan
// Kare: alan 984×600. Dikey (TikTok): alan 832×710, aynı düzen kuralları.
function media(imgs, v = false) {
  const W = v ? 832 : 984, H = v ? 710 : 600, L = v ? 440 : 520, G = 24;
  const small = v ? 220 : 184, big = H - small - G;
  const half = (W - G) / 2;
  const im = (u, st = '') => `<div class="img" style="${st}"><img crossorigin="anonymous" src="${esc(u)}"></div>`;
  if (imgs.length >= 3) return im(imgs[0], `width:${L}px;height:${H}px;flex-shrink:0`) +
    `<div class="col">${im(imgs[1], `height:${small}px`)}${im(imgs[2], `height:${big}px`)}</div>`;
  if (imgs.length === 2) return im(imgs[0], `width:${half}px;height:${H}px`) + im(imgs[1], `width:${half}px;height:${H}px`);
  return `<div class="img" style="width:${W}px;height:${H}px;background:#fff"><img crossorigin="anonymous" src="${esc(imgs[0])}" style="object-fit:contain"></div>`;
}

function adV(key, p, logo) {
  const o = OFFER[key];
  return `<div class="ad v">
  <div class="head">
    <div class="row"><span class="bf">BLACK FRIDAY</span><span class="end">${o.end}</span></div>
    <span class="big">NET ${o.pct} İNDİRİM</span>
    <span class="cats">${o.cats}</span>
  </div>
  <div class="media">${media(p.imgs, true)}</div>
  <div class="vfoot">
    <img class="logo" src="${logo}" alt="oltâ"><span class="name">${esc(p.name)}</span>
    <span class="lbl">${o.label}</span>
    <div class="vpr"><span class="now">${esc(p.now)}</span><span class="old">${esc(p.old)}</span></div>
  </div>
  <div class="vbot"></div>
</div>`;
}

function ad(key, p, logo) {
  if (/V$/.test(key)) return adV(key.replace(/V$/, ''), p, logo);
  const o = OFFER[key];
  return `<div class="ad">
  <div class="head">
    <div class="row"><span class="bf">BLACK FRIDAY</span><span class="end">${o.end}</span></div>
    <span class="big">NET ${o.pct} İNDİRİM</span>
    <span class="cats">${o.cats}</span>
  </div>
  <div class="media">${media(p.imgs)}</div>
  <div class="foot">
    <div class="left"><img class="logo" src="${logo}" alt="oltâ"><span class="name">${esc(p.name)}</span></div>
    <div class="right"><span class="old">${esc(p.old)}</span><span class="lbl">${o.label}</span><span class="now">${esc(p.now)}</span></div>
  </div>
</div>`;
}

// Düz zeminli ürün çekimi mi? (beyaz, açık gri, siyah… fark etmez) Kenar piksellerinin neredeyse tamamı aynı renkse evet.
// Düz zeminli çekimler kırpılmadan sığdırılır (contain) ve boşluk fotoğrafın kendi zemin rengiyle doldurulur;
// lifestyle görseller alanı doldurur (cover). Böylece bileklik/zincir gibi geniş ürünler dar kutularda kesilmez.
function plainBackground(img) {
  try {
    const N = 48, c = document.createElement('canvas'); c.width = c.height = N;
    const g = c.getContext('2d');
    g.fillStyle = '#fff'; g.fillRect(0, 0, N, N); // şeffaf PNG'ler beyaz zemin sayılır
    g.drawImage(img, 0, 0, N, N);
    const d = g.getImageData(0, 0, N, N).data, px = [];
    for (let i = 0; i < N; i++) for (const [x, y] of [[i, 0], [i, N - 1], [0, i], [N - 1, i]]) {
      const k = (y * N + x) * 4; px.push([d[k], d[k + 1], d[k + 2]]);
    }
    const med = [0, 1, 2].map((ch) => px.map((p) => p[ch]).sort((a, b) => a - b)[px.length >> 1]);
    const near = px.filter((p) => Math.abs(p[0] - med[0]) + Math.abs(p[1] - med[1]) + Math.abs(p[2] - med[2]) < 30).length;
    return near / px.length > 0.9 ? `rgb(${med.join(',')})` : null;
  } catch { return null; }
}
function fitStudio() {
  for (const img of document.querySelectorAll('.img img')) {
    const bg = img.naturalWidth && plainBackground(img);
    if (bg) { img.style.objectFit = 'contain'; img.parentElement.style.background = bg; }
  }
}

(async () => {
  const { key, p, logo } = window.__CTX;
  if (/V$/.test(key)) document.documentElement.classList.add('v');
  document.body.innerHTML = ad(key, p, logo);
  await document.fonts.ready;
  // Başlığı içerik genişliğine (984px) tam oturt
  const big = document.querySelector('.big');
  big.style.fontSize = (112 * 984 / big.getBoundingClientRect().width) + 'px';
  await Promise.all([...document.images].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));
  fitStudio();
  window.__BROKEN = [...document.images].filter(i => !i.naturalWidth).map(i => i.src.slice(0, 120));
  window.__READY = true;
})();
</script>
</body></html>
